<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Oxidog 2026 Christmas Exchange Gift</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
      background-color: #f0f0f0;
    }
    .container {
      background: white;
      padding: 20px;
      display: inline-block;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    select, input, button {
      margin: 10px;
      padding: 10px;
      font-size: 16px;
    }
    .hidden {
      display: none;
    }
    .result {
      font-size: 20px;
      font-weight: bold;
      color: green;
      margin-top: 20px;
    }
    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Team Oxidog 2026 Christmas Exchange Gift</h2>
  
  <label for="userSelect">Select Your Name:</label><br>
  <select id="userSelect">
    <option value="">-- Select --</option>
  </select>
  <br>
  
  <label for="userPin">Enter 4-Digit PIN:</label><br>
  <input type="password" id="userPin" maxlength="4" placeholder="PIN">
  <br>

  <button onclick="handleDraw()">Reveal My Gift Target</button>

  <div id="resultBox" class="result hidden">
    <p>Your Team Color: <span id="resColor"></span></p>
    <p>You draw: <span id="resTarget" style="color: red;"></span></p>
  </div>

  <br><br>
  <button onclick="toggleAdmin()" style="font-size: 12px;">Organizer Panel</button>

  <div id="adminPanel" class="hidden">
    <br>
    <input type="password" id="adminPass" placeholder="Enter Passcode">
    <button onclick="loginAdmin()">Login</button>

    <div id="adminContent" class="hidden">
      <table>
        <thead>
          <tr>
            <th>Participant</th>
            <th>Target</th>
            <th>Team Color</th>
          </tr>
        </thead>
        <tbody id="adminTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // FIXED MASTER LIST (RETURNING TO CLASSIC UI)
  const masterPairs = {
    "Cym":          { target: "Grace",        color: "Red" },
    "Grace":        { target: "Ronel",        color: "Gold" },
    "Ronel":        { target: "Bri",          color: "Green" },
    "Bri":          { target: "Roysan",       color: "Silver" },
    "Roysan":       { target: "Angelica",     color: "Gold" },
    "Angelica":     { target: "Kit",          color: "Green" },
    "Kit":          { target: "Nuy",          color: "Red" },
    "Nuy":          { target: "Jay-ar",       color: "Gold" },
    "Jay-ar":       { target: "Angelyn",      color: "Green" },
    "Angelyn":      { target: "Gboy",         color: "Silver" },
    "Gboy":         { target: "Dharelle",     color: "Red" },
    "Dharelle":     { target: "Abe",          color: "Silver" },
    "Abe":          { target: "Jm",           color: "Gold" },
    "Jm":           { target: "Sarah",        color: "Silver" },
    "Sarah":        { target: "Sean Tristan", color: "Red" },
    "Sean Tristan": { target: "Olive",        color: "Green" },
    "Olive":        { target: "Renej",        color: "Red" },
    "Renej":        { target: "Aegon",        color: "Silver" },
    "Aegon":        { target: "Honeyleth",    color: "Gold" },
    "Honeyleth":    { target: "Karen",        color: "Silver" },
    "Karen":        { target: "Cym",          color: "Red" }
  };

  const select = document.getElementById("userSelect");
  Object.keys(masterPairs).forEach(p => {
    let opt = document.createElement("option");
    opt.value = p;
    opt.textContent = p;
    select.appendChild(opt);
  });

  function handleDraw() {
    const name = document.getElementById("userSelect").value;
    const pin = document.getElementById("userPin").value;

    if (!name || pin.length !== 4) {
      alert("Please select your name and enter a 4-digit PIN.");
      return;
    }

    const res = masterPairs[name];
    if (res) {
      document.getElementById("resColor").textContent = res.color;
      document.getElementById("resTarget").textContent = res.target;
      document.getElementById("resultBox").classList.remove("hidden");
    }
  }

  function toggleAdmin() {
    document.getElementById("adminPanel").classList.toggle("hidden");
  }

  function loginAdmin() {
    const pass = document.getElementById("adminPass").value;
    if (pass === "oxidog2026") {
      document.getElementById("adminContent").classList.remove("hidden");
      const tbody = document.getElementById("adminTableBody");
      tbody.innerHTML = "";

      for (let p in masterPairs) {
        let row = `<tr>
          <td>${p}</td>
          <td>${masterPairs[p].target}</td>
          <td>${masterPairs[p].color}</td>
        </tr>`;
        tbody.innerHTML += row;
      }
    } else {
      alert("Wrong passcode!");
    }
  }
</script>

</body>
</html>
