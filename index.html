<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Oxidog 2026 Christmas Exchange Gift</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f4f6f9; padding: 20px; }
    .card { background: white; max-width: 450px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    select, input, button { width: 90%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
    button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #218838; }
    .hidden { display: none; }
    .result { background: #e9f7ef; padding: 15px; border-radius: 8px; border: 1px solid #28a745; margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #007bff; color: white; }
  </style>
</head>
<body>

<div class="card">
  <h2>🎄 Team Oxidog 2026 🎁</h2>
  <p>Select your name & enter a 4-digit PIN to unwrap!</p>

  <select id="userSelect">
    <option value="">-- Choose Your Name --</option>
  </select>

  <input type="password" id="userPin" maxlength="4" placeholder="Enter 4-digit PIN">
  
  <div>
    <button onclick="handleDraw()">Reveal My Gift Target</button>
  </div>

  <div id="resultBox" class="result hidden">
    <h3>🎉 Your Draw Result 🎉</h3>
    <p><strong>Your Team Color:</strong> <span id="resColor" style="font-weight: bold;"></span></p>
    <p><strong>You are Secret Santa for:</strong> <span id="resTarget" style="font-size: 20px; color: #d9534f; font-weight: bold;"></span></p>
  </div>

  <hr style="margin: 25px 0;">
  
  <button onclick="toggleAdmin()" style="background: #6c757d;">🔑 Organizer Trace Panel</button>

  <div id="adminPanel" class="hidden">
    <h3>Organizer Master List & Audit</h3>
    <input type="password" id="adminPass" placeholder="Enter Passcode">
    <button onclick="loginAdmin()">Login</button>

    <div id="adminContent" class="hidden">
      <table>
        <thead>
          <tr>
            <th>Participant</th>
            <th>Target</th>
            <th>Team Color</th>
          </tr>
        </thead>
        <tbody id="adminTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // FIXED MASTER LIST: GUARANTEED UNIQUE PAIRINGS, SIBLING EXCLUSION & TEAM COLORS
  const masterPairs = {
    "Cym":          { target: "Grace",        color: "Red" },
    "Grace":        { target: "Ronel",        color: "Gold" },
    "Ronel":        { target: "Bri",          color: "Green" },
    "Bri":          { target: "Roysan",       color: "Silver" },
    "Roysan":       { target: "Angelica",     color: "Gold" },
    "Angelica":     { target: "Kit",          color: "Green" },
    "Kit":          { target: "Nuy",          color: "Red" },
    "Nuy":          { target: "Jay-ar",       color: "Gold" },
    "Jay-ar":       { target: "Angelyn",      color: "Green" },
    "Angelyn":      { target: "Gboy",         color: "Silver" },
    "Gboy":         { target: "Dharelle",     color: "Red" },
    "Dharelle":     { target: "Abe",          color: "Silver" },
    "Abe":          { target: "Jm",           color: "Gold" },
    "Jm":           { target: "Sarah",        color: "Silver" },
    "Sarah":        { target: "Sean Tristan", color: "Red" },
    "Sean Tristan": { target: "Olive",        color: "Green" },
    "Olive":        { target: "Renej",        color: "Red" },
    "Renej":        { target: "Aegon",        color: "Silver" },
    "Aegon":        { target: "Honeyleth",    color: "Gold" },
    "Honeyleth":    { target: "Karen",        color: "Silver" },
    "Karen":        { target: "Cym",          color: "Red" }
  };

  // Populate Dropdown List
  const select = document.getElementById("userSelect");
  Object.keys(masterPairs).forEach(p => {
    let opt = document.createElement("option");
    opt.value = p;
    opt.textContent = p;
    select.appendChild(opt);
  });

  function handleDraw() {
    const name = document.getElementById("userSelect").value;
    const pin = document.getElementById("userPin").value;

    if (!name || pin.length !== 4) {
      alert("Please select your name and enter a 4-digit PIN.");
      return;
    }

    const res = masterPairs[name];
    if (res) {
      document.getElementById("resColor").textContent = res.color;
      document.getElementById("resTarget").textContent = res.target;
      document.getElementById("resultBox").classList.remove("hidden");
    }
  }

  function toggleAdmin() {
    document.getElementById("adminPanel").classList.toggle("hidden");
  }

  function loginAdmin() {
    const pass = document.getElementById("adminPass").value;
    if (pass === "oxidog2026") {
      document.getElementById("adminContent").classList.remove("hidden");
      const tbody = document.getElementById("adminTableBody");
      tbody.innerHTML = "";

      for (let p in masterPairs) {
        let row = `<tr>
          <td>${p}</td>
          <td>${masterPairs[p].target}</td>
          <td style="font-weight:bold;">${masterPairs[p].color}</td>
        </tr>`;
        tbody.innerHTML += row;
      }
    } else {
      alert("Wrong passcode!");
    }
  }
</script>

</body>
</html>
